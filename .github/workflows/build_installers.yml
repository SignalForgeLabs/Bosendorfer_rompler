name: Build Cross-Platform Installers

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. WINDOWS: Build VST3 + Standalone & Inno Setup Installer (.exe)
  # ============================================================================
  build-windows:
    name: Windows Installer (.exe)
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release Targets
        run: cmake --build build --config Release --target BosendorferImperial_VST3 BosendorferImperial_Standalone -j 4

      - name: Prepare Artifacts for Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/BosendorferImperial_artefacts/Release/VST3"
          New-Item -ItemType Directory -Force -Path "build/BosendorferImperial_artefacts/Release/Standalone"
          if (Test-Path "build/BosendorferImperial_artefacts/VST3") {
            Copy-Item -Recurse -Force "build/BosendorferImperial_artefacts/VST3/*" "build/BosendorferImperial_artefacts/Release/VST3/"
          }
          if (Test-Path "build/BosendorferImperial_artefacts/Standalone") {
            Copy-Item -Recurse -Force "build/BosendorferImperial_artefacts/Standalone/*" "build/BosendorferImperial_artefacts/Release/Standalone/"
          }
          New-Item -ItemType Directory -Force -Path "dist/windows"
          Get-ChildItem -Recurse build/BosendorferImperial_artefacts

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc packaging/windows/Bosendorfer_Imperial_Installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/Bosendorfer_Imperial_Installer.iss
          } else {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" packaging/windows/Bosendorfer_Imperial_Installer.iss
          }

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bosendorfer_Imperial_290_Windows_Installer
          path: dist/windows/*.exe

  # ============================================================================
  # 2. MACOS: Build Universal Binary (arm64 + x86_64), PKG & DMG Installer
  # ============================================================================
  build-macos:
    name: macOS Installer (.pkg & .dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make Scripts Executable
        run: chmod +x packaging/mac/build_mac_installer.sh

      - name: Build Universal Binaries & Package Installer
        run: ./packaging/mac/build_mac_installer.sh

      - name: Upload macOS Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bosendorfer_Imperial_290_macOS_Installer
          path: dist/mac/*

  # ============================================================================
  # 3. LINUX: Build VST3 & Standalone Package (.tar.gz & .zip)
  # ============================================================================
  build-linux:
    name: Linux Package (.tar.gz)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Audio & GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libxi-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libegl-dev \
            ninja-build

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release Targets
        run: cmake --build build --config Release --target BosendorferImperial_VST3 BosendorferImperial_Standalone -j$(nproc)

      - name: Package Linux Distribution
        run: |
          chmod +x packaging/linux/build_linux_package.sh
          ./packaging/linux/build_linux_package.sh

      - name: Upload Linux Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bosendorfer_Imperial_290_Linux_Package
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.zip

  # ============================================================================
  # 4. RELEASE: Publish GitHub Release with all Installers
  # ============================================================================
  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-macos, build-linux]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Bosendorfer_Imperial_290_Windows_Installer
          path: release-files/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Bosendorfer_Imperial_290_macOS_Installer
          path: release-files/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Bosendorfer_Imperial_290_Linux_Package
          path: release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Bosendorfer Imperial 290 v1.0.${{ github.run_number }}"
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
